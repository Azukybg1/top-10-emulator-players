
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOCKMAN GO - GALAXY RANKINGS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 background:#030512;
 color:#fff;
 font-family:'Inter',sans-serif;
 overflow-x:hidden;
 min-height:100vh;
}

canvas{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 z-index:0;
 pointer-events:none;
}

.bg-glow{
 position:fixed;
 inset:0;
 z-index:1;
 pointer-events:none;
 background:
 radial-gradient(ellipse at 15% 20%,#3424a855,transparent 45%),
 radial-gradient(ellipse at 85% 75%,#006bff40,transparent 45%),
 radial-gradient(ellipse at 50% 50%,#711bba22,transparent 65%);
 animation:nebula 12s ease-in-out infinite alternate;
}

@keyframes nebula{
 from{filter:hue-rotate(0deg);transform:scale(1)}
 to{filter:hue-rotate(35deg);transform:scale(1.12)}
}

.container{
 max-width:580px;
 margin:0 auto;
 padding:24px;
 position:relative;
 z-index:2;
}

h1{
 text-align:center;
 font-size:38px;
 font-weight:900;
 letter-spacing:1.5px;
 margin-top:30px;
 line-height:.95;
}

h1 span{
 background:linear-gradient(180deg,#fff 5%,#a9c9ff 40%,#9b5cff 75%,#4b8cff);
 -webkit-background-clip:text;
 -webkit-text-fill-color:transparent;
 filter:drop-shadow(0 0 15px #6b8cffaa)
        drop-shadow(0 0 35px #914cff66);
}

.sub{
 text-align:center;
 color:#a9baff;
 font-size:10px;
 letter-spacing:4px;
 font-weight:700;
 margin:12px 0 32px;
 text-shadow:0 0 12px #678cff;
}

.sub::before{content:'✦ '}
.sub::after{content:' ✦'}

.tabs{
 display:flex;
 gap:10px;
 margin-bottom:24px;
 padding:6px;
 background:#10162bba;
 border:1px solid #5268a955;
 border-radius:999px;
 box-shadow:0 0 25px #5268a922 inset,0 0 20px #5268a922;
 backdrop-filter:blur(15px);
}

.tab{
 flex:1;
 padding:12px;
 text-align:center;
 border-radius:999px;
 font-weight:800;
 font-size:13px;
 cursor:pointer;
 transition:.35s;
 color:#8191b9;
}

.tab.active{
 background:linear-gradient(120deg,#477dff,#9c55ff);
 color:white;
 box-shadow:0 0 25px #667dff88,inset 0 1px 0 #ffffff66;
}

.list{display:none}
.list.active{
 display:block;
 animation:rise .5s ease;
}

@keyframes rise{
 from{opacity:0;transform:translateY(15px)}
 to{opacity:1;transform:translateY(0)}
}

.row{
 display:flex;
 align-items:center;
 gap:14px;
 background:linear-gradient(120deg,#111a35dd,#15112ddd);
 border:1px solid #384b7b88;
 border-radius:16px;
 padding:14px 16px;
 margin-bottom:10px;
 position:relative;
 overflow:hidden;
 transition:.35s;
 backdrop-filter:blur(12px);
}

.row::after{
 content:'';
 position:absolute;
 top:0;
 left:-120%;
 width:65%;
 height:100%;
 background:linear-gradient(100deg,transparent,#a7c5ff22,transparent);
 transform:skewX(-20deg);
 transition:.8s;
 pointer-events:none;
}

.row:hover::after{left:130%}

.row:hover{
 transform:translateY(-3px) scale(1.01);
 border-color:#819aff;
 box-shadow:0 0 25px #526dff33;
}

.row.top{
 background:linear-gradient(120deg,#1b2450,#241747);
 border-color:#8274ff88;
}

.row.top.rank{
 background:linear-gradient(120deg,#477dff,#9854ff);
 color:white;
 border:none;
 box-shadow:0 0 25px #697aff88,0 0 45px #8c4cff33;
}

.rank{
 width:38px;
 height:38px;
 display:grid;
 place-items:center;
 border-radius:10px;
 background:#1b2545;
 border:1px solid #5369a9;
 font-weight:900;
 font-size:13px;
 flex-shrink:0;
}

.name{
 font-weight:700;
 font-size:14.5px;
 letter-spacing:.2px;
}

.tag{
 margin-left:auto;
 font-size:8.5px;
 font-weight:900;
 letter-spacing:1.2px;
 padding:6px 11px;
 border-radius:999px;
 background:linear-gradient(120deg,#477dff,#a04fff);
 color:white;
 box-shadow:0 0 15px #647aff66;
 white-space:nowrap;
}

.row:not(.top) .tag{
 background:#202b4c;
 color:#aabaff;
 box-shadow:none;
 border:1px solid #52649b;
}

.row.top .tag{
 background:#fff;
 color:#7655e9;
}

@media(max-width:400px){
 h1{font-size:31px}
 .tab{font-size:11px;padding:11px 5px}
 .container{padding:16px}
}
</style>
</head>

<body>

<canvas id="particles"></canvas>
<div class="bg-glow"></div>

<div class="container">

<h1><span>BLOCKMAN GO<br>BED WARS</span></h1>

<div class="sub">GALAXY EDITION • OFFICIAL RANKINGS</div>

<div class="tabs">
 <div class="tab active" onclick="showTab('mobile',this)">✦ TOP MOBILE</div>
 <div class="tab" onclick="showTab('emu',this)">✧ TOP EMULATOR</div>
</div>

<div id="mobile" class="list active"></div>
<div id="emu" class="list"></div>

</div>

<script>

const mobile = ["N/A","Elzair","CnBeast","Player","Beta","Rishi","Naxo","Killer","ItzRainbowBG","Aiden","Habib","IamNotPc","Sehur","ThunderBG","SamuraiBG","","","","",""];

const emu = ["Benykz","AzukyBG","Bannks","SanoManjiro","Fredd","Phoenix","Mihan","Astro","Killer","Anfal"];

function render(list,id){
 let html="";
 for(let i=0;i<list.length;i++){
   if(!list[i]) continue;
   let r=i+1;
   let icon = r==1?'👑':r==2?'✦':r==3?'✧':'';
   let topClass = r<=3? " top" : "";
   let badge = `<div class="tag">${icon} TOP ${r}</div>`;
   html += `<div class="row${topClass}"><div class="rank">${r}</div><div class="name">T${r} • ${list[i]}</div>${badge}</div>`;
 }
 document.getElementById(id).innerHTML=html;
}

render(mobile,'mobile');
render(emu,'emu');

function showTab(id,el){
 document.querySelectorAll('.list').forEach(l=>l.classList.remove('active'));
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 el.classList.add('active');
}

// GALAXY PARTICLES

const c=document.getElementById('particles');
const x=c.getContext('2d');

let w,h,dots=[];

function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 w=innerWidth;
 h=innerHeight;
 c.width=w*dpr;
 c.height=h*dpr;
 x.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener('resize',resize);
resize();

const colors=['#ffffff','#9ebcff','#a66bff','#62baff','#d8aaff'];

for(let i=0;i<150;i++){
 dots.push({
  x:Math.random()*w,
  y:Math.random()*h,
  r:Math.random()*1.7+.3,
  s:Math.random()*.35+.08,
  o:Math.random()*.65+.2,
  p:Math.random()*Math.PI*2,
  c:colors[Math.floor(Math.random()*colors.length)]
 });
}

let frame=0;

(function anim(){
 x.clearRect(0,0,w,h);
 frame+=.012;

 dots.forEach(p=>{
   p.y-=p.s;
   p.x+=Math.sin(frame+p.p)*.12;

   if(p.y<0){
    p.y=h;
    p.x=Math.random()*w;
   }

   x.globalAlpha=p.o*(.65+.35*Math.sin(frame*2+p.p));
   x.fillStyle=p.c;
   x.shadowBlur=12;
   x.shadowColor=p.c;
   x.beginPath();
   x.arc(p.x,p.y,p.r,0,Math.PI*2);
   x.fill();
 });

 x.globalAlpha=1;
 x.shadowBlur=0;

 requestAnimationFrame(anim);
})();

</script>
</body>
</html>
