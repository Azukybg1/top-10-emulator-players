<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BW Galaxy Tiers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;color:#fff;font-family:'Outfit',sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 20% 20%, #2a1a6a 0%, #120a2e 25%, #050510 60%, #000 100%)}
/* PARTICULAS */
#particles{position:fixed;inset:0;z-index:-1;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;background:#8a2be2;border-radius:50%;box-shadow:0 0 6px #8a2be2;animation:floatP linear infinite}
@keyframes floatP{0%{transform:translateY(100vh) translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) translateX(100px);opacity:0}}
.wrap{max-width:640px;margin:auto;padding:18px;filter:blur(15px);pointer-events:none;transition:.5s}.wrap.unlocked{filter:none;pointer-events:all}
h1{text-align:center;font-size:36px;font-weight:900;margin-top:15px;animation:glowText 2s ease-in-out infinite alternate}
@keyframes glowText{from{text-shadow:0 0 10px #7c3aed55}to{text-shadow:0 0 25px #7c3aed,0 0 40px #7c3aed88}}
h1 span{background:linear-gradient(90deg,#a78bfa,#60a5fa,#f0abfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:hue 3s linear infinite}
@keyframes hue{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(20deg)}}
.line{height:2px;background:linear-gradient(90deg,transparent,#8a2be2,#60a5fa,#f0abfc,transparent);margin:15px 0;animation:lineMove 2s linear infinite;background-size:200% 100%}
@keyframes lineMove{0%{background-position:0% 0%}100%{background-position:200% 0%}}
.tabs{display:flex;gap:8px}.tab{flex:1;padding:12px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);text-align:center;font-weight:900;cursor:pointer;font-size:12px;transition:.3s}
.tab:hover{transform:translateY(-2px);box-shadow:0 5px 15px #7c3aed44}
.tab.active{background:linear-gradient(135deg,#7c3aed,#4f46e5);box-shadow:0 0 20px #7c3aed;transform:scale(1.05)}
.list{display:none;margin-top:16px;animation:fadeIn.4s}.list.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:10px;margin-bottom:9px;transition:.3s;animation:slideIn.5s backwards}
.card:nth-child(1){animation-delay:.05s}.card:nth-child(2){animation-delay:.1s}.card:nth-child(3){animation-delay:.15s}.card:nth-child(n+4){animation-delay:.2s}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.card:hover{transform:translateX(5px) scale(1.02);border-color:#7c3aed88;box-shadow:0 5px 20px #7c3aed33}
.card.t1{border:2px solid #facc15;box-shadow:0 0 18px #facc15aa,0 0 35px #facc1555;animation:slideIn.5s backwards, pulseGold 2s infinite.5s}
@keyframes pulseGold{0%,100%{box-shadow:0 0 18px #facc15aa}50%{box-shadow:0 0 30px #facc15,0 0 50px #facc1588}}
.num{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:12px;background:#0a0a18;border:1px solid #222;transition:.3s}
.num.gold{background:linear-gradient(135deg,#fff176,#facc15,#ff8f00);color:#000;box-shadow:0 0 15px #facc15;animation:spinGold 3s ease-in-out infinite}
@keyframes spinGold{0%,100%{transform:rotateY(0deg)}50%{transform:rotateY(20deg)}}
.num.silver{background:linear-gradient(135deg,#fff,#94a3b8);color:#000}.num.bronze{background:linear-gradient(135deg,#fdba74,#f97316);color:#000}
.name{font-weight:800;flex:1}
.like{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);padding:6px 10px;border-radius:20px;cursor:pointer;transition:.2s}
.like:hover{transform:scale(1.15);box-shadow:0 0 15px #ec489988}.like:active{transform:scale(.9)}
.like.liked{background:linear-gradient(135deg,#8b5cf6,#ec4899);pointer-events:none;animation:heartPop.5s}
@keyframes heartPop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
#popup{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.9);backdrop-filter:blur(12px);display:grid;place-items:center;padding:18px}
.popup-box{background:#15152f;border:2px solid #7c3aed;border-radius:20px;padding:22px;width:100%;max-width:380px;box-shadow:0 0 40px #7c3aed88,0 0 80px #7c3aed33;animation:popIn.6s cubic-bezier(.68,-0.55,.27,1.55)}
@keyframes popIn{0%{transform:scale(0) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.popup-box h2{text-align:center;font-size:22px;animation:glowText 2s infinite alternate}.popup-box p{text-align:center;opacity:.6;font-size:12px;margin:6px 0 14px}
.popup-box input,.popup-box select{width:100%;padding:13px;border-radius:12px;background:#0a0a18;border:1px solid #333;color:#fff;margin-bottom:10px;font-family:'Outfit';font-size:13px;outline:none;transition:.3s}
.popup-box input:focus,.popup-box select:focus{border-color:#7c3aed;box-shadow:0 0 15px #7c3aed55;transform:scale(1.02)}
.popup-box button{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-weight:900;cursor:pointer;margin-top:8px;transition:.3s;animation:pulseBtn 2s infinite}
@keyframes pulseBtn{0%,100%{box-shadow:0 0 0 0 #7c3aed88}50%{box-shadow:0 0 0 10px #7c3aed00}}
.popup-box button:hover{transform:scale(1.05);box-shadow:0 0 25px #7c3aed}
.reg-card{background:rgba(255,255,255,0.06);border:1px solid rgba(124,58,237,0.4);border-radius:12px;padding:11px;margin-bottom:8px;display:flex;justify-content:space-between;animation:slideIn.4s}
</style></head><body><div class="bg"></div><div id="particles"></div>
<div id="popup"><div class="popup-box"><h2>🎮 REGISTRO</h2><p>Obligatorio para ver el Top</p>
<input id="pName" placeholder="Nombre en el juego *">
<input id="pID" type="number" placeholder="ID del juego *">
<select id="pPlat"><option value="">Plataforma *</option><option value="Mobile">📱 Mobile</option><option value="Emu">💻 Emu</option></select>
<input id="pTeam" placeholder="Team / Clan *">
<button onclick="doRegister()">ENTRAR AL TOP 🔥</button>
</div></div>
<div class="wrap" id="mainWrap"><h1>BLOCKMAN GO<br><span>BED WARS</span></h1><div class="line"></div>
<div class="tabs"><div class="tab active" onclick="showTab('mobile',this)">🔥 MOBILE</div><div class="tab" onclick="showTab('emu',this)">😈 EMU</div><div class="tab" onclick="showTab('regs',this)">📋 (<span id="countRegs">0</span>)</div></div>
<div id="mobile" class="list active"></div><div id="emu" class="list"></div><div id="regs" class="list"><div id="regsList"></div></div></div>
<script>
const DB="https://bwtiers-e00f0-default-rtdb.firebaseio.com";
const mobilePlayers=["Amaury","NotEgo","CnBeast","Flaax","Flinney","Elzair","Kurio","Beta","Zactyo","Naxo","Ownzy","Kairo","Killer","Rishi","Adish","Yuta","Kisaki","Samurai","zeus","Quar"];
const emuPlayers=["Beny","Bannks","Fredd","Azuky","SanoManjiro","Mihan","Astro","Aris","Anfal","Beta"];
let allLikes={}, allRegs={};
// PARTICULAS
const pCont=document.getElementById('particles');for(let i=0;i<25;i++){const d=document.createElement('div');d.className='particle';d.style.left=Math.random()*100+'%';d.style.animationDuration=(Math.random()*10+10)+'s';d.style.animationDelay=Math.random()*10+'s';d.style.width=d.style.height=(Math.random()*3+1)+'px';pCont.appendChild(d);}
function checkLock(){if(localStorage.getItem('bw_registered')){document.getElementById('popup').style.display='none';document.getElementById('mainWrap').classList.add('unlocked');}}
async function doRegister(){const name=document.getElementById('pName').value.trim();const idGame=document.getElementById('pID').value.trim();const plat=document.getElementById('pPlat').value;const team=document.getElementById('pTeam').value.trim();if(!name||!idGame||!plat||!team){alert('❌ LLENA TODO BRO');return;}const btn=document.querySelector('.popup-box button');btn.textContent='REGISTRANDO...';btn.disabled=true;const id=Date.now();const data={name,idGame,plat,team,date:new Date().toLocaleDateString()};try{await fetch(DB+`/registered/${id}.json`,{method:'PUT',body:JSON.stringify(data)});localStorage.setItem('bw_registered',JSON.stringify(data));allRegs[id]=data;document.getElementById('popup').style.display='none';document.getElementById('mainWrap').classList.add('unlocked');}catch(e){alert('Error');btn.disabled=false;btn.textContent='ENTRAR AL TOP 🔥';}}
async function load(){try{const r1=await fetch(DB+"/likes.json");allLikes=await r1.json()||{};}catch(e){}try{const r2=await fetch(DB+"/registered.json");allRegs=await r2.json()||{};}catch(e){}render();renderRegs();}
function render(){renderList('mobile',mobilePlayers);renderList('emu',emuPlayers);}
function renderList(id,players){const c=document.getElementById(id);c.innerHTML="";const my=JSON.parse(localStorage.getItem('myLikes')||'[]');players.forEach((name,i)=>{const rank=i+1;let ex=rank==1?'t1':'';let nc=rank==1?'gold':rank==2?'silver':rank==3?'bronze':'';const key=id+"_"+name.replace(/\s/g,'_');const count=allLikes[key]||0;const liked=my.includes(key)?"liked":"";c.innerHTML+=`<div class="card ${ex}" style="animation-delay:${i*0.05}s"><div class="num ${nc}">T${rank}</div><div class="name">${name} ${rank==1?'👑':''}</div><div class="like ${liked}" onclick="like('${key}')"><span>❤️</span><b>${count}</b></div></div>`;});}
function renderRegs(){const c=document.getElementById('regsList');const counter=document.getElementById('countRegs');const vals=Object.values(allRegs).reverse();if(counter)counter.textContent=vals.length;if(!c)return;c.innerHTML="";if(vals.length==0){c.innerHTML='<p style="opacity:.5;text-align:center;margin-top:20px">Aún no hay registrados</p>';return;}vals.forEach(r=>{c.innerHTML+=`<div class="reg-card"><div><b>${r.name}</b> <small style="opacity:.6">(${r.plat})</small><br><small style="opacity:.6">ID: ${r.idGame} | ${r.team}</small></div><div>✅</div></div>`;});}
async function like(key){const my=JSON.parse(localStorage.getItem('myLikes')||'[]');if(my.includes(key))return;let cur=(allLikes[key]||0)+1;allLikes[key]=cur;my.push(key);localStorage.setItem('myLikes',JSON.stringify(my));render();await fetch(DB+`/likes/${key}.json`,{method:'PUT',body:JSON.stringify(cur)});}
window.showTab=(id,el)=>{document.querySelectorAll('.list').forEach(l=>l.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');el.classList.add('active');}
checkLock();load();setInterval(load,5000);
</script></body></html>
