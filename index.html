<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockman Go - Bed Wars Rankings</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070707;color:#fff;font-family:Inter,Arial,sans-serif}
.container{max-width:600px;margin:0 auto;padding:20px}
h1{text-align:center;font-size:30px;font-weight:900;letter-spacing:2px;margin-top:20px}
.sub{text-align:center;opacity:.5;font-size:12px;letter-spacing:3px;margin-top:6px;margin-bottom:25px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{flex:1;padding:12px;text-align:center;border-radius:999px;font-weight:800;cursor:pointer;background:#1a1a1a;border:1px solid #2a2a2a}
.tab.active{background:#fff;color:#000}
.list{display:none}
.list.active{display:block}
.row{display:flex;align-items:center;gap:12px;background:#111;border:1px solid #222;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.rank{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;background:#1e1e1e;font-weight:800;font-size:12px}
.row.top .rank{background:#fff;color:#000}
.name{font-weight:700;font-size:14px}
.tag{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:1px;opacity:.6}
</style>
</head>
<body>
<div class="container">
<h1>BLOCKMAN GO<br>BED WARS</h1>
<div class="sub">OFFICIAL RANKINGS</div>

<div class="tabs">
<div class="tab active" onclick="show('mobile',this)">TOP MOBILE</div>
<div class="tab" onclick="show('emu',this)">TOP EMULATOR</div>
</div>

<div id="mobile" class="list active"></div>
<div id="emu" class="list"></div>
</div>

<script>
const mobile = [
" Amaury"," NotEgo"," Huzu"," Flaax"," Flinney"," Elzair"," Kurio"," CnBeast"," Beta"," Zactyo"," Naxo"," Ownzy"," Dray"," Mito"," Ken"," Levi"," Rex"," Axel"," Beny"," Quar"
];
const emu = [
"Beny","Bannks","Fredd","Jxke","Sora","Nax","Azuky","Rexo","Beta","Astra"
];

function render(id, data){
 let html="";
 data.forEach((n,i)=>{
   let r=i+1;
   html+=`<div class="row ${r<=3?'top':''}"><div class="rank">${r}</div><div class="name">${n.trim()}</div>${r<=3?'<div class="tag">TOP ${r}</div>':''}</div>`;
 });
 document.getElementById(id).innerHTML=html;
}
render("mobile",mobile);
render("emu",emu);

function show(id,el){
 document.querySelectorAll('.list').forEach(l=>l.classList.remove('active'));
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 el.classList.add('active');
}
</script>
</body>
</html>
