<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BW Galaxy Tiers - Global</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&display=swap');*{margin:0;padding:0;box-sizing:border-box}body{background:#050510;color:#fff;font-family:'Outfit',sans-serif}.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 20% 20%, #2a1a6a 0%, #120a2e 25%, #050510 60%, #000 100%)}.stars{position:fixed;inset:0;z-index:-1;background-image:radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),radial-gradient(1.5px 1.5px at 100px 80px, #aaf, transparent);background-size:250px 250px;opacity:.5}.wrap{max-width:640px;margin:auto;padding:18px;z-index:1;position:relative}h1{text-align:center;font-size:33px;font-weight:900;text-shadow:0 0 20px #8a2be2;margin-top:20px}h1 span{background:linear-gradient(90deg,#a78bfa,#60a5fa,#f0abfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.line{height:1px;background:linear-gradient(90deg,transparent,#8a2be2,#60a5fa,transparent);margin:18px 0}.tabs{display:flex;gap:10px}.tab{flex:1;padding:13px;border-radius:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);text-align:center;font-weight:900;cursor:pointer}.tab.active{background:linear-gradient(135deg,#7c3aed,#4f46e5);border-color:#a78bfa;box-shadow:0 0 20px #7c3aed88}.list{display:none;margin-top:16px}.list.active{display:block}.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}.card.t1{border-color:#facc15aa;box-shadow:0 0 22px #facc1544}.card.t2{border-color:#cbd5e1aa}.card.t3{border-color:#fb923caa}.num{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:13px;background:#0a0a18;border:1px solid #222}.num.gold{background:linear-gradient(135deg,#fff176,#facc15,#ff8f00);color:#000}.num.silver{background:linear-gradient(135deg,#fff,#94a3b8);color:#000}.num.bronze{background:linear-gradient(135deg,#fdba74,#f97316);color:#000}.name{font-weight:800;flex:1}.like{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);padding:6px 10px;border-radius:20px;cursor:pointer}.like.liked{background:linear-gradient(135deg,#8b5cf6,#ec4899);box-shadow:0 0 10px #8b5cf6;pointer-events:none}.like b{font-size:12px}</style></head><body><div class="bg"></div><div class="stars"></div><div class="wrap"><h1>BLOCKMAN GO<br><span>BED WARS</span></h1><div class="line"></div><div class="tabs"><div class="tab active" onclick="showTab('mobile',this)">🔥 TOP MOBILE</div><div class="tab" onclick="showTab('emu',this)">😈 TOP EMU</div></div><div id="mobile" class="list active"></div><div id="emu" class="list"></div></div><script>
const DB="https://bwtiers-e00f0-default-rtdb.firebaseio.com";
const mobilePlayers=["Amaury","NotEgo","Flaax","Flinney","Elzair","Kurio","Cnbeast","Beta","Zactyo","Naxo","Ownzy","Kairo","Killer","Rishi","Adish","Yuta","Zeus","kisaki","samurai","Quar"];
const emuPlayers=["Beny","Bannks","Fredd","Azuky","SanoManjiro","Mihan","Astro","Aris","Anfal","Beta"];
let allLikes={};
async function loadLikes(){try{const r=await fetch(DB+"/likes.json");allLikes=await r.json()||{};}catch(e){allLikes={};}render();}
function render(){renderList('mobile',mobilePlayers);renderList('emu',emuPlayers);}
function renderList(id,players){const c=document.getElementById(id);c.innerHTML="";const my=JSON.parse(localStorage.getItem('myLikes')||'[]');players.forEach((name,i)=>{const rank=i+1;let ex="";let nc="";if(rank==1){ex="t1";nc="gold"}else if(rank==2){ex="t2";nc="silver"}else if(rank==3){ex="t3";nc="bronze"}const key=id+"_"+name.replace(/\s/g,'_');const count=allLikes[key]||0;const liked=my.includes(key)?"liked":"";c.innerHTML+=`<div class="card ${ex}"><div class="num ${nc}">T${rank}</div><div class="name">${name}</div><div class="like ${liked}" onclick="like('${key}')"><span>❤️</span><b id="c-${key}">${count}</b></div></div>`;});}
async function like(key){const my=JSON.parse(localStorage.getItem('myLikes')||'[]');if(my.includes(key))return;const el=document.getElementById('c-'+key);let cur=parseInt(el.textContent)||0;el.textContent=cur+1;my.push(key);localStorage.setItem('myLikes',JSON.stringify(my));try{await fetch(DB+`/likes/${key}.json`,{method:'PUT',body:JSON.stringify(cur+1)});allLikes[key]=cur+1;}catch(e){}render();}
window.showTab=(id,el)=>{document.querySelectorAll('.list').forEach(l=>l.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');el.classList.add('active');}
loadLikes();setInterval(loadLikes,3000);
</script></body></html>
