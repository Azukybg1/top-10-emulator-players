<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BW Galaxy Tiers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Orbitron:wght@900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0202;color:#fff;font-family:'Outfit',sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 20% 20%, #6a0a0a 0%, #2e0a0a 25%, #0a0202 60%, #000 100%)}
#particles{position:fixed;inset:0;z-index:-1;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;background:#ff0000;border-radius:50%;box-shadow:0 0 8px #ff0000;animation:floatP linear infinite}
@keyframes floatP{0%{transform:translateY(100vh) translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) translateX(120px);opacity:0}}
.wrap{max-width:680px;margin:auto;padding:16px;filter:blur(15px);pointer-events:none;transition:.5s}.wrap.unlocked{filter:none;pointer-events:all}
h1{text-align:center;font-family:'Orbitron',sans-serif;font-size:32px;font-weight:900;margin-top:10px;color:#ff2222;animation:glowRed 1.5s infinite alternate}
@keyframes glowRed{from{text-shadow:0 0 10px #ff0000}to{text-shadow:0 0 25px #ff0000,0 0 50px #ff000088}}
h1 span{background:linear-gradient(90deg,#ff0000,#ff6600,#ff0000);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 100%;animation:lineMove 2s linear infinite}
.line{height:3px;background:linear-gradient(90deg,transparent,#ff0000,#ff6600,#ff0000,transparent);margin:12px 0;background-size:200% 100%;animation:lineMove 2s linear infinite}
@keyframes lineMove{0%{background-position:0%}100%{background-position:200%}}
.tabs{display:flex;gap:8px}.tab{flex:1;padding:12px;border-radius:12px;background:rgba(255,0,0,0.08);border:1px solid rgba(255,0,0,0.25);text-align:center;font-weight:900;cursor:pointer;font-size:12px;transition:.3s}
.tab.active{background:linear-gradient(135deg,#ff0000,#8b0000);box-shadow:0 0 20px #ff0000;transform:scale(1.05)}
.list{display:none;margin-top:16px}.list.active{display:block}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,0,0,0.15);border-radius:14px;padding:12px 13px;display:flex;align-items:center;gap:10px;margin-bottom:10px;transition:.3s;cursor:pointer;animation:slideIn.5s backwards}
.card:hover{transform:translateX(6px) scale(1.02);border-color:#ff000088;box-shadow:0 5px 25px #ff000033}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
.card.t1{border:2px solid #ffaa00;background:linear-gradient(135deg,rgba(255,170,0,0.15),rgba(255,0,0,0.1));box-shadow:0 0 20px #ffaa00aa;animation:pulseFire 1.8s infinite}
@keyframes pulseFire{0%,100%{box-shadow:0 0 20px #ffaa00aa}50%{box-shadow:0 0 35px #ffaa00,0 0 60px #ff6600}}
.num{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:11px;background:#150505;border:1px solid #330000}
.num.gold{background:linear-gradient(135deg,#fff176,#ffaa00,#ff4400);color:#000;box-shadow:0 0 15px #ffaa00}
.name{font-weight:800;flex:1;line-height:1.2}.name small{display:block;font-size:10px;opacity:.7;font-weight:600;margin-top:2px}
.badge-history{background:rgba(255,0,0,0.2);border:1px solid #ff0000;color:#ff9999;font-size:9px;margin-top:4px;display:inline-block;padding:2px 7px;border-radius:10px}
.like{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,0,0,0.2);padding:6px 10px;border-radius:20px;cursor:pointer}
.like.liked{background:linear-gradient(135deg,#ff0000,#8b0000);pointer-events:none}
#popup{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.9);backdrop-filter:blur(12px);display:grid;place-items:center;padding:18px}
.popup-box{background:#1a0505;border:2px solid #ff0000;border-radius:20px;padding:22px;width:100%;max-width:380px;box-shadow:0 0 40px #ff000088}
.popup-box h2{text-align:center;font-size:22px;color:#ff2222}.popup-box p{text-align:center;opacity:.6;font-size:12px;margin:6px 0 14px}
.popup-box input,.popup-box select{width:100%;padding:13px;border-radius:12px;background:#0a0202;border:1px solid #440000;color:#fff;margin-bottom:10px;font-family:'Outfit';font-size:13px;outline:none}
.popup-box button{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#ff0000,#8b0000);color:#fff;font-weight:900;cursor:pointer}
#profileModal{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);display:none;place-items:center;padding:18px}
#profileModal.show{display:grid}
.profile-box{background:#1a0505;border:2px solid #ff0000;border-radius:20px;padding:20px;width:100%;max-width:380px;box-shadow:0 0 40px #ff0000;animation:popIn.4s;position:relative}
@keyframes popIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.reg-card{background:rgba(255,0,0,0.08);border:1px solid rgba(255,0,0,0.3);border-radius:12px;padding:11px;margin-bottom:8px;display:flex;justify-content:space-between}
.discord-footer{margin-top:25px;text-align:center;padding:20px;border-top:1px solid rgba(255,0,0,0.2)}
.discord-btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#ff0000,#8b0000);color:#fff;padding:14px 28px;border-radius:12px;font-weight:900;text-decoration:none;font-size:14px;box-shadow:0 0 20px #ff000088}
.discord-footer small{display:block;margin-top:10px;opacity:.5;font-size:11px}
</style></head><body><div class="bg"></div><div id="particles"></div>
<div id="popup"><div class="popup-box"><h2 id="t_reg_title">🎮 REGISTRO</h2><p id="t_reg_sub">Obligatorio para ver el Top</p>
<input id="pName" placeholder="Nombre *"><input id="pID" type="number" placeholder="ID *">
<select id="pPlat"><option value="" id="t_opt_plat">Plataforma *</option><option value="Mobile">📱 Mobile</option><option value="Emu">💻 Emu</option></select>
<input id="pTeam" placeholder="Team *"><button onclick="doRegister()" id="t_btn_enter">ENTRAR AL TOP 🔥</button></div></div>
<div id="profileModal" onclick="if(event.target==this)closeProfile()"><div class="profile-box"><button onclick="closeProfile()" style="position:absolute;top:10px;right:15px;background:none;border:none;color:#fff;font-size:22px;cursor:pointer">✕</button><h2 id="profName">Jugador</h2><p id="profRank" style="text-align:center;margin:8px 0;font-weight:900"></p><div id="profHistory" style="margin-top:12px"></div></div></div>
<div class="wrap" id="mainWrap"><h1>BLOCKMAN GO<br><span>BED WARS</span></h1><div class="line"></div>
<div style="text-align:center;font-size:11px;opacity:.6;margin-bottom:10px">Temporada: <span id="currentMonthYear"></span></div>
<div class="tabs"><div class="tab active" onclick="showTab('mobile',this)" id="t_tab_mobile">🔥 MOBILE</div><div class="tab" onclick="showTab('emu',this)" id="t_tab_emu">😈 EMU</div><div class="tab" onclick="showTab('regs',this)">📋 (<span id="countRegs">0</span>)</div></div>
<div id="mobile" class="list active"></div><div id="emu" class="list"></div><div id="regs" class="list"><div id="regsList"></div></div>
<div class="discord-footer"><a href="https://discord.gg/dXU7y79JF" target="_blank" class="discord-btn" id="t_discord_btn">💬 ÚNETE A NUESTRO DISCORD</a><small id="t_discord_small">discord.gg/dXU7y79JF - Soporte, torneos y reclutamientos</small></div></div>
<script>
const userLang=(navigator.language||'es').toLowerCase();const isEnglish=userLang.startsWith('en');
const L=isEnglish?{reg_title:"🎮 REGISTER",reg_sub:"Required to see the Top",ph_name:"In-game name *",ph_id:"Game ID *",ph_team:"Team / Clan *",opt_plat:"Platform *",btn_enter:"ENTER THE TOP 🔥",alert_fill:"❌ FILL ALL FIELDS",tab_mobile:"🔥 MOBILE",tab_emu:"😈 EMU",discord_btn:"💬 JOIN OUR DISCORD",discord_small:"discord.gg/dXU7y79JF",no_regs:"No players registered yet",btn_registering:"REGISTERING...",was_top:"Was",in_month:"in",current_top:"Current Top",history_title:"📜 History"}:{reg_title:"🎮 REGISTRO",reg_sub:"Obligatorio para ver el Top",ph_name:"Nombre en el juego *",ph_id:"ID del juego *",ph_team:"Team / Clan *",opt_plat:"Plataforma *",btn_enter:"ENTRAR AL TOP 🔥",alert_fill:"❌ LLENA TODO BRO",tab_mobile:"🔥 MOBILE",tab_emu:"😈 EMU",discord_btn:"💬 ÚNETE A NUESTRO DISCORD",discord_small:"discord.gg/dXU7y79JF - Soporte, torneos y reclutamientos",no_regs:"Aún no hay registrados",btn_registering:"REGISTRANDO...",was_top:"Fue",in_month:"en",current_top:"Top Actual",history_title:"📜 Historial"};
document.getElementById('t_reg_title').textContent=L.reg_title;document.getElementById('t_reg_sub').textContent=L.reg_sub;document.getElementById('pName').placeholder=L.ph_name;document.getElementById('pID').placeholder=L.ph_id;document.getElementById('pTeam').placeholder=L.ph_team;document.getElementById('t_opt_plat').textContent=L.opt_plat;document.getElementById('t_btn_enter').textContent=L.btn_enter;document.getElementById('t_tab_mobile').textContent=L.tab_mobile;document.getElementById('t_tab_emu').textContent=L.tab_emu;document.getElementById('t_discord_btn').textContent=L.discord_btn;document.getElementById('t_discord_small').textContent=L.discord_small;
const monthsES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];const monthsEN=["January","February","March","April","May","June","July","August","September","October","November","December"];function getMonthName(idx){return isEnglish?monthsEN[idx]:monthsES[idx]}
const now=new Date();const currentYear=now.getFullYear();const currentMonth=now.getMonth();
document.getElementById('currentMonthYear').textContent=`${getMonthName(currentMonth)} ${currentYear}`;
const DB="https://bwtiers-e00f0-default-rtdb.firebaseio.com";
// NUEVO TOP MOBILE ACTUALIZADO
const mobilePlayers=["Amaury","NotEgo","CnBeast","Flaax","Flinney","Elzair","Kurio","Beta","Zactyo","Naxo","Ownzy","EgeOwns","Kairo","Killer","Rishi","Adish","Yuta","Kisaki","Samurai","Quar","ZeusDiff"];
const emuPlayers=["Beny","Bannks","Fredd","Azuky","SanoManjiro","Mihan","Astro","Aris","Anfal","Beta"];
let allLikes={},allRegs={},allHistory={};
const pCont=document.getElementById('particles');for(let i=0;i<35;i++){const d=document.createElement('div');d.className='particle';d.style.left=Math.random()*100+'%';d.style.animationDuration=(Math.random()*8+6)+'s';d.style.animationDelay=Math.random()*8+'s';d.style.width=d.style.height=(Math.random()*4+1)+'px';pCont.appendChild(d);}
function checkLock(){if(localStorage.getItem('bw_registered')){document.getElementById('popup').style.display='none';document.getElementById('mainWrap').classList.add('unlocked');}}
async function doRegister(){const name=document.getElementById('pName').value.trim();const idGame=document.getElementById('pID').value.trim();const plat=document.getElementById('pPlat').value;const team=document.getElementById('pTeam').value.trim();if(!name||!idGame||!plat||!team){alert(L.alert_fill);return;}const btn=document.getElementById('t_btn_enter');btn.textContent=L.btn_registering;btn.disabled=true;const id=Date.now();const data={name,idGame,plat,team,date:new Date().toLocaleDateString()};try{await fetch(DB+`/registered/${id}.json`,{method:'PUT',body:JSON.stringify(data)});localStorage.setItem('bw_registered',JSON.stringify(data));allRegs[id]=data;document.getElementById('popup').style.display='none';document.getElementById('mainWrap').classList.add('unlocked');}catch(e){alert('Error');btn.disabled=false;btn.textContent=L.btn_enter;}}
async function load(){try{const r1=await fetch(DB+"/likes.json");allLikes=await r1.json()||{};}catch(e){}try{const r2=await fetch(DB+"/registered.json");allRegs=await r2.json()||{};}catch(e){}try{const r3=await fetch(DB+"/history.json");allHistory=await r3.json()||{};}catch(e){}render();renderRegs();checkAndSaveHistory();}
function checkAndSaveHistory(){const lastMonth=currentMonth==0?11:currentMonth-1;const lastYear=currentMonth==0?currentYear-1:currentYear;const key=`${lastYear}-${String(lastMonth+1).padStart(2,'0')}`;if(!allHistory[key]){const snapshot={mobile:{},emu:{},month:lastMonth,year:lastYear,monthName:getMonthName(lastMonth)};mobilePlayers.forEach((n,i)=>snapshot.mobile[n]=i+1);emuPlayers.forEach((n,i)=>snapshot.emu[n]=i+1);fetch(DB+`/history/${key}.json`,{method:'PUT',body:JSON.stringify(snapshot)});allHistory[key]=snapshot;}}
function render(){renderList('mobile',mobilePlayers);renderList('emu',emuPlayers);}
function renderList(id,players){const c=document.getElementById(id);c.innerHTML="";const my=JSON.parse(localStorage.getItem('myLikes')||'[]');players.forEach((name,i)=>{const rank=i+1;let ex=rank==1?"t1":"";let nc=rank==1?"gold":"";const key=id+"_"+name.replace(/\s/g,'_');const count=allLikes[key]||0;const liked=my.includes(key)?"liked":"";let historyBadge="";const lastMonthKey=`${currentMonth==0?currentYear-1:currentYear}-${String((currentMonth==0?11:currentMonth-1)+1).padStart(2,'0')}`;const hist=allHistory[lastMonthKey];if(hist&&hist[id]&&hist[id][name]){historyBadge=`<span class="badge-history">${L.was_top} T${hist[id][name]} ${L.in_month} ${getMonthName(hist.month)} ${hist.year}</span>`;}c.innerHTML+=`<div class="card ${ex}" style="animation-delay:${i*0.07}s" onclick="openProfile('${name}',${rank},'${id}')"><div class="num ${nc}">T${rank}</div><div class="name">${name}<br>${historyBadge}</div><div class="like ${liked}" onclick="event.stopPropagation();like('${key}')"><span>❤️</span><b>${count}</b></div></div>`;});}
function openProfile(name,rank,cat){document.getElementById('profileModal').classList.add('show');document.getElementById('profName').textContent=name;document.getElementById('profRank').innerHTML=`${L.current_top}: <span style="color:#ff0000">T${rank}</span> en ${cat.toUpperCase()} - ${getMonthName(currentMonth)} ${currentYear}`;let histHtml=`<h3 style="font-size:13px;opacity:.8;margin:10px 0 6px">${L.history_title}</h3>`;let hasHist=false;Object.keys(allHistory).sort().reverse().forEach(k=>{const h=allHistory[k];if(h[cat]&&h[cat][name]){hasHist=true;histHtml+=`<div style="background:rgba(255,0,0,0.1);border:1px solid rgba(255,0,0,0.2);padding:8px 10px;border-radius:10px;margin-bottom:6px;display:flex;justify-content:space-between"><span>${getMonthName(h.month)} ${h.year}</span><b>T${h[cat][name]}</b></div>`;}});if(!hasHist){histHtml+=`<p style="opacity:.5;font-size:12px;text-align:center">${isEnglish?"Will appear next month":"Aparecerá el próximo mes"}<br>Ej: ${L.was_top} T${rank} ${L.in_month} ${getMonthName(currentMonth==0?11:currentMonth-1)} ${currentYear}</p>`;}document.getElementById('profHistory').innerHTML=histHtml;}
function closeProfile(){document.getElementById('profileModal').classList.remove('show');}
function renderRegs(){const c=document.getElementById('regsList');const counter=document.getElementById('countRegs');const vals=Object.values(allRegs).reverse();if(counter)counter.textContent=vals.length;if(!c)return;c.innerHTML="";if(vals.length==0){c.innerHTML=`<p style="opacity:.5;text-align:center;margin-top:20px">${L.no_regs}</p>`;return;}vals.forEach(r=>{c.innerHTML+=`<div class="reg-card"><div><b>${r.name}</b> <small style="opacity:.6">(${r.plat})</small><br><small style="opacity:.6">ID: ${r.idGame} | ${r.team}</small></div><div>✅</div></div>`;});}
async function like(key){const my=JSON.parse(localStorage.getItem('myLikes')||'[]');if(my.includes(key))return;let cur=(allLikes[key]||0)+1;allLikes[key]=cur;my.push(key);localStorage.setItem('myLikes',JSON.stringify(my));render();await fetch(DB+`/likes/${key}.json`,{method:'PUT',body:JSON.stringify(cur)});}
window.showTab=(id,el)=>{document.querySelectorAll('.list').forEach(l=>l.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');el.classList.add('active');}
checkLock();load();setInterval(load,8000);
</script></body></html>
