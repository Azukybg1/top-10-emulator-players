<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOCKMAN GO - BED WARS RANKINGS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070707;color:#fff;font-family:Inter,Arial,sans-serif;overflow-x:hidden}
canvas{position:fixed;inset:0;z-index:-1;opacity:.7}
.container{max-width:600px;margin:0 auto;padding:20px;position:relative;z-index:2}
h1{text-align:center;font-size:32px;font-weight:900;letter-spacing:2px;margin-top:25px;animation:glow 3s infinite alternate}
@keyframes glow{from{text-shadow:0 0 10px #fff3}to{text-shadow:0 0 20px #fff,0 0 40px #ffffff55}}
.sub{text-align:center;opacity:.5;font-size:11px;letter-spacing:4px;margin-top:8px;margin-bottom:28px}
.tabs{display:flex;gap:10px;margin-bottom:22px}
.tab{flex:1;padding:13px;text-align:center;border-radius:999px;font-weight:800;cursor:pointer;background:#141414;border:1px solid #222;transition:.3s}
.tab.active{background:#fff;color:#000;box-shadow:0 0 25px #ffffff66;transform:scale(1.03)}
.list{display:none}
.list.active{display:block;animation:rise.4s}
@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.row{display:flex;align-items:center;gap:12px;background:#111;border:1px solid #1f1f1f;border-radius:14px;padding:12px 14px;margin-bottom:9px;transition:.2s;position:relative;overflow:hidden}
.row:hover{transform:translateX(4px);border-color:#fff3}
.row.top{border-color:#ffffff55;box-shadow:0 0 20px #ffffff22}
.row.top::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff18,transparent);animation:shine 2.8s infinite}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.rank{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;background:#1c1c1c;border:1px solid #2a2a2a;font-weight:800;font-size:12px;z-index:2}
.row.top.rank{background:#fff;color:#000;box-shadow:0 0 15px #fff;animation:rankPulse 2s infinite}
@keyframes rankPulse{0%,100%{box-shadow:0 0 12px #fff}50%{box-shadow:0 0 22px #fff}}
.name{font-weight:700;font-size:14px;z-index:2}
.tag{margin-left:auto;font-size:9px;font-weight:900;letter-spacing:1px;background:#222;color:#fff;padding:5px 10px;border-radius:20px;z-index:2}
.row.top.tag{background:#fff;color:#000;box-shadow:0 0 10px #fff}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="container">
<h1>BLOCKMAN GO<br>BED WARS</h1>
<div class="sub">OFFICIAL RANKINGS</div>
<div class="tabs">
<div class="tab active" onclick="showTab('mobile',this)">TOP MOBILE</div>
<div class="tab" onclick="showTab('emu',this)">TOP EMULATOR</div>
</div>
<div id="mobile" class="list active"></div>
<div id="emu" class="list"></div>
</div>
<script>
const mobile = ["Amaury","Quar","Kurio","CnBeast","Huzu","Flinney","Flaax","EgeOwns","Beta","Zactyo","Naxo","Kisaki","Harsh","Zeus","Ownzy","Kairo","Rishi","Adish","Killer","Yuta"];
const emu = ["Beny","Bannks","Azuky","SanoManjiro","Fredd","Phoenix","Mihan","Aris","Aris","Beta"];

function renderMobile(){
 let html="";
 for(let i=0;i<mobile.length;i++){
   let r=i+1;
   let topClass = r<=3? " top" : "";
   let badge = r<=3? '<div class="tag">TOP ' + r + '</div>' : '';
   html += '<div class="row' + topClass + '"><div class="rank">' + r + '</div><div class="name">T' + r + ' • ' + mobile[i] + '</div>' + badge + '</div>';
 }
 document.getElementById("mobile").innerHTML=html;
}
function renderEmu(){
 let html="";
 for(let i=0;i<emu.length;i++){
   let r=i+1;
   let topClass = r<=3? " top" : "";
   let badge = r<=3? '<div class="tag">TOP ' + r + '</div>' : '';
   html += '<div class="row' + topClass + '"><div class="rank">' + r + '</div><div class="name">T' + r + ' • ' + emu[i] + '</div>' + badge + '</div>';
 }
 document.getElementById("emu").innerHTML=html;
}
renderMobile(); renderEmu();

function showTab(id,el){
 document.querySelectorAll('.list').forEach(l=>l.classList.remove('active'));
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 el.classList.add('active');
}
const c=document.getElementById('particles'),x=c.getContext('2d');
let w,h,dots=[];
function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
window.addEventListener('resize',resize);resize();
for(let i=0;i<90;i++) dots.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+0.6,s:Math.random()*0.8+0.2,o:Math.random()*0.5+0.2});
(function anim(){
 x.clearRect(0,0,w,h);
 dots.forEach(p=>{
   p.y-=p.s; p.x+=Math.sin(p.y/80)*0.4;
   if(p.y<0){p.y=h;p.x=Math.random()*w}
   x.globalAlpha=p.o;
   x.fillStyle='#fff';x.shadowBlur=8;x.shadowColor='#fff';
   x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();
 });
 requestAnimationFrame(anim);
})();
</script>
</body>
</html>
