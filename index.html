<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BW Galaxy Tiers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;color:#fff;font-family:'Outfit',sans-serif}
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 20% 20%, #2a1a6a 0%, #120a2e 25%, #050510 60%, #000 100%)}
.wrap{max-width:640px;margin:auto;padding:18px;position:relative}
h1{text-align:center;font-size:32px;font-weight:900;margin-top:15px}h1 span{background:linear-gradient(90deg,#a78bfa,#60a5fa,#f0abfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.line{height:1px;background:linear-gradient(90deg,transparent,#8a2be2,#60a5fa,transparent);margin:15px 0}
.tabs{display:flex;gap:8px}.tab{flex:1;padding:11px 5px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);text-align:center;font-weight:900;cursor:pointer;font-size:13px}
.tab.active{background:linear-gradient(135deg,#7c3aed,#4f46e5);border-color:#a78bfa;box-shadow:0 0 15px #7c3aed88}
.list{display:none;margin-top:16px}.list.active{display:block}
.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:10px;margin-bottom:9px;position:relative}
.card.t1{border-color:#facc15;box-shadow:0 0 18px #facc1544}.num{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:12px;background:#0a0a18;border:1px solid #222}.num.gold{background:linear-gradient(135deg,#fff176,#facc15,#ff8f00);color:#000}.num.silver{background:linear-gradient(135deg,#fff,#94a3b8);color:#000}.num.bronze{background:linear-gradient(135deg,#fdba74,#f97316);color:#000}
.name{font-weight:800;flex:1}.like{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);padding:6px 10px;border-radius:20px;cursor:pointer}.like.liked{background:linear-gradient(135deg,#8b5cf6,#ec4899);pointer-events:none}
.reg-card{background:rgba(124,58,237,0.15);border:1px solid #7c3aed88;border-radius:14px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.reg-card b{color:#a78bfa}.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-weight:900;font-family:'Outfit';cursor:pointer;margin-top:10px}
input{width:100%;padding:12px;border-radius:10px;background:#0a0a18;border:1px solid #333;color:#fff;margin-bottom:8px;font-family:'Outfit'}
.crown{font-size:14px;margin-left:4px}
</style></head><body><div class="bg"></div><div class="wrap"><h1>BLOCKMAN GO<br><span>BED WARS</span></h1><div class="line"></div>
<div class="tabs"><div class="tab active" onclick="showTab('mobile',this)">🔥 MOBILE</div><div class="tab" onclick="showTab('emu',this)">😈 EMU</div><div class="tab" onclick="showTab('regs',this)">📋 REGISTROS</div></div>
<div id="mobile" class="list active"></div><div id="emu" class="list"></div>
<div id="regs" class="list"><div style="background:rgba(255,255,255,0.05);padding:15px;border-radius:14px;border:1px solid rgba(255,255,255,0.1)"><h3 style="margin-bottom:10px">Registrar Jugador</h3><input id="rName" placeholder="Nombre en el juego"><input id="rContact" placeholder="Discord / Contacto"><button class="btn" onclick="register()">REGISTRAR AHORA</button></div><div id="regsList" style="margin-top:15px"></div></div></div>
<script>
const DB="https://bwtiers-e00f0-default-rtdb.firebaseio.com";
const mobilePlayers=["Amaury","NotEgo","CnBeast","Flaax","Flinney","Elzair","Kurio","Beta","Zactyo","Naxo","Ownzy","Kairo","Killer","Rishi","Adish","Yuta","Kisaki","Samurai","zeus","Quar"];
const emuPlayers=["Beny","Bannks","Fredd","Azuky","SanoManjiro","Mihan","Astro","Aris","Anfal","Beta"];
let allLikes={}; let allRegs={};
async function load(){try{const r1=await fetch(DB+"/likes.json");allLikes=await r1.json()||{};}catch(e){}try{const r2=await fetch(DB+"/registered.json");allRegs=await r2.json()||{};}catch(e){}render();renderRegs();}
function render(){renderList('mobile',mobilePlayers);renderList('emu',emuPlayers);}
function renderList(id,players){const c=document.getElementById(id);c.innerHTML="";const my=JSON.parse(localStorage.getItem('myLikes')||'[]');players.forEach((name,i)=>{const rank=i+1;let ex=rank==1?'t1':'';let nc=rank==1?'gold':rank==2?'silver':rank==3?'bronze':'';const key=id+"_"+name.replace(/\s/g,'_');const count=allLikes[key]||0;const liked=my.includes(key)?"liked":"";const crown=rank==1?'👑':'';c.innerHTML+=`<div class="card ${ex}"><div class="num ${nc}">T${rank}</div><div class="name">${name} ${crown}</div><div class="like ${liked}" onclick="like('${key}')"><span>❤️</span><b>${count}</b></div></div>`;});}
function renderRegs(){const c=document.getElementById('regsList');c.innerHTML="";const vals=Object.values(allRegs).reverse();if(vals.length==0){c.innerHTML='<p style="opacity:.5;text-align:center;margin-top:20px">Aún no hay jugadores registrados</p>';return;}c.innerHTML=`<p style="margin-bottom:10px;opacity:.7">Total registrados: ${vals.length}</p>`;vals.forEach(r=>{c.innerHTML+=`<div class="reg-card"><div><b>${r.name}</b><br><small style="opacity:.6">${r.contact||'Sin contacto'} - ${r.date||''}</small></div><div style="font-size:12px;opacity:.5">✅</div></div>`;});}
async function like(key){const my=JSON.parse(localStorage.getItem('myLikes')||'[]');if(my.includes(key))return;let cur=(allLikes[key]||0)+1;allLikes[key]=cur;my.push(key);localStorage.setItem('myLikes',JSON.stringify(my));render();await fetch(DB+`/likes/${key}.json`,{method:'PUT',body:JSON.stringify(cur)});}
async function register(){const n=document.getElementById('rName').value.trim();const co=document.getElementById('rContact').value.trim();if(!n)return alert('Pon tu nombre');const id=Date.now();const data={name:n,contact:co,date:new Date().toLocaleDateString()};await fetch(DB+`/registered/${id}.json`,{method:'PUT',body:JSON.stringify(data)});allRegs[id]=data;document.getElementById('rName').value='';document.getElementById('rContact').value='';renderRegs();alert('¡Registrado! ✅');}
window.showTab=(id,el)=>{document.querySelectorAll('.list').forEach(l=>l.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');el.classList.add('active');}
load();setInterval(load,4000);
</script></body></html>
