<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BW Galaxy Tiers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;color:#fff;font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 20% 20%, #2a1a6a 0%, #120a2e 25%, #050510 60%, #000 100%)}
.stars{position:fixed;inset:0;z-index:-1;background-image:radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),radial-gradient(1.5px 1.5px at 100px 80px, #aaf, transparent),radial-gradient(1px 1px at 150px 150px, #fff, transparent);background-repeat:repeat;background-size:250px 250px;opacity:.5}
.wrap{max-width:640px;margin:auto;padding:18px;position:relative;z-index:1}
h1{text-align:center;font-size:33px;font-weight:900;text-shadow:0 0 20px #8a2be2;margin-top:20px;line-height:1}
h1 span{background:linear-gradient(90deg,#a78bfa,#60a5fa,#f0abfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:#a78bfa;letter-spacing:5px;font-size:10px;margin-top:6px}
.line{height:1px;background:linear-gradient(90deg,transparent,#8a2be2,#60a5fa,transparent);margin:18px 0;box-shadow:0 0 12px #8a2be2}
.tabs{display:flex;gap:10px}
.tab{flex:1;padding:13px;border-radius:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);text-align:center;font-weight:900;cursor:pointer;backdrop-filter:blur(10px)}
.tab.active{background:linear-gradient(135deg,#7c3aed,#4f46e5);border-color:#a78bfa;box-shadow:0 0 20px #7c3aed88}
.list{display:none;margin-top:16px}
.list.active{display:block;animation:up.3s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.card.t1{border-color:#facc15aa;box-shadow:0 0 22px #facc1544}
.card.t2{border-color:#cbd5e1aa;box-shadow:0 0 18px #fff2}
.card.t3{border-color:#fb923caa;box-shadow:0 0 18px #fb923c33}
.num{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:13px;background:#0a0a18;border:1px solid #222}
.num.gold{background:linear-gradient(135deg,#fff176,#facc15,#ff8f00);color:#000}
.num.silver{background:linear-gradient(135deg,#fff,#94a3b8);color:#000}
.num.bronze{background:linear-gradient(135deg,#fdba74,#f97316);color:#000}
.name{font-weight:800;font-size:15px;flex:1}
.like{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);padding:6px 10px;border-radius:20px;cursor:pointer;transition:.2s;user-select:none}
.like:hover{background:rgba(139,92,246,0.2);border-color:#8b5cf6}
.like.liked{background:linear-gradient(135deg,#8b5cf6,#ec4899);border-color:#f0abfc;box-shadow:0 0 10px #8b5cf6}
.like span.count{font-size:12px;font-weight:800;min-width:12px}
</style>
</head>
<body>
<div class="bg"></div><div class="stars"></div>
<div class="wrap">
<h1>BLOCKMAN GO<br><span>BED WARS</span></h1>
<div class="sub">GALAXY RANKINGS 2026</div>
<div class="line"></div>
<div class="tabs">
<div class="tab active" onclick="showTab('mobile',this)">🔥 TOP MOBILE</div>
<div class="tab" onclick="showTab('emu',this)">😈 TOP EMU</div>
</div>

<div id="mobile" class="list active"></div>
<div id="emu" class="list"></div>

<div class="line"></div>
<div style="text-align:center;color:#ffffff33;font-size:9px;letter-spacing:4px">BW GALAXY • LIKES SAVED</div>
</div>

<script>
const mobilePlayers = ["Amaury","NotEgo","Flaax","Flinney","Elzair","Kurio","Cnbeast","Beta","Zactyo","Naxo","Ownzy","Kairo","Killer","Rishi","Adish","Yuta","Zeus","kisaki","samurai","Quar"];
const emuPlayers = ["Beny","Bannks","Fredd","Azuky","SanoManjiro","Mihan","Astro","Aris","Anfal","Beta"];

function getLikes(){return JSON.parse(localStorage.getItem('bw_likes')||'{}')}
function saveLikes(d){localStorage.setItem('bw_likes',JSON.stringify(d))}
function getMyLikes(){return JSON.parse(localStorage.getItem('bw_mylikes')||'[]')}
function saveMyLikes(d){localStorage.setItem('bw_mylikes',JSON.stringify(d))}

function renderList(id, players, prefix){
  const likes = getLikes();
  const myLikes = getMyLikes();
  const container = document.getElementById(id);
  container.innerHTML = "";
  players.forEach((name,i)=>{
    const rank = i+1;
    const key = prefix+"_"+name;
    const count = likes[key]||0;
    const liked = myLikes.includes(key);
    let extra = ""; let numClass = "";
    if(rank==1){extra="t1"; numClass="gold"} else if(rank==2){extra="t2"; numClass="silver"} else if(rank==3){extra="t3"; numClass="bronze"}
    container.innerHTML += `
      <div class="card ${extra}">
        <div class="num ${numClass}">T${rank}</div>
        <div class="name">${name}</div>
        <div class="like ${liked?'liked':''}" onclick="toggleLike('${key}',this)">
          <span>❤️</span><span class="count">${count}</span>
        </div>
      </div>`;
  });
}

function toggleLike(key, el){
  let likes = getLikes();
  let myLikes = getMyLikes();
  const countEl = el.querySelector('.count');
  if(myLikes.includes(key)){
    likes[key] = Math.max(0,(likes[key]||1)-1);
    myLikes = myLikes.filter(k=>k!=key);
    el.classList.remove('liked');
  } else {
    likes[key] = (likes[key]||0)+1;
    myLikes.push(key);
    el.classList.add('liked');
    el.style.transform="scale(1.3)"; setTimeout(()=>el.style.transform="scale(1)",150);
  }
  countEl.textContent = likes[key]||0;
  saveLikes(likes); saveMyLikes(myLikes);
}

function showTab(id,el){
  document.querySelectorAll('.list').forEach(l=>l.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}

renderList('mobile', mobilePlayers, 'mobile');
renderList('emu', emuPlayers, 'emu');
</script>
</body>
</html>
