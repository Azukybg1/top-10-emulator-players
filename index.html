<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BW Galaxy Tiers - Effects</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;color:#fff;font-family:'Outfit',sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 20% 20%, #2a1a6a 0%, #120a2e 25%, #050510 60%, #000 100%)}
.stars{position:fixed;inset:0;z-index:-1;background-image:radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),radial-gradient(1.5px 1.5px at 100px 80px, #aaf, transparent);background-size:250px 250px;opacity:.5;animation:moveStars 60s linear infinite}
@keyframes moveStars{from{transform:translateY(0)}to{transform:translateY(-250px)}}
.wrap{max-width:640px;margin:auto;padding:18px;position:relative}
h1{text-align:center;font-size:36px;font-weight:900;text-shadow:0 0 20px #8a2be2;margin-top:20px;animation:glow 2s infinite alternate}
@keyframes glow{from{text-shadow:0 0 10px #8a2be2}to{text-shadow:0 0 30px #8a2be2, 0 0 40px #60a5fa}}
h1 span{background:linear-gradient(90deg,#a78bfa,#60a5fa,#f0abfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.line{height:1px;background:linear-gradient(90deg,transparent,#8a2be2,#60a5fa,transparent);margin:18px 0}
.tabs{display:flex;gap:10px}.tab{flex:1;padding:13px;border-radius:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);text-align:center;font-weight:900;cursor:pointer;transition:.3s}
.tab.active{background:linear-gradient(135deg,#7c3aed,#4f46e5);border-color:#a78bfa;box-shadow:0 0 20px #7c3aed88;transform:scale(1.05)}
.list{display:none;margin-top:16px}.list.active{display:block;animation:fadeIn.4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:12px;transition:.3s;position:relative;overflow:hidden}
.card:hover{transform:translateX(5px) scale(1.02)}
/* EFECTOS UNICOS */
.card.t1{background:linear-gradient(135deg, rgba(250,204,21,0.25), rgba(234,179,8,0.15));border:2px solid #facc15;box-shadow:0 0 30px #facc15aa, inset 0 0 20px rgba(250,204,21,0.2);animation:goldPulse 2s infinite}
.card.t1::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);transform:rotate(25deg);animation:shine 3s infinite}
.card.t2{background:linear-gradient(135deg, rgba(203,213,225,0.2), rgba(148,163,184,0.1));border:2px solid #e2e8f0;box-shadow:0 0 20px #cbd5e1aa}
.card.t3{background:linear-gradient(135deg, rgba(251,146,60,0.2), rgba(249,115,22,0.1));border:2px solid #fb923c;box-shadow:0 0 20px #fb923c88}
.card.t4-10{border-left:4px solid #60a5fa;box-shadow:0 0 15px rgba(96,165,250,0.2)}
@keyframes goldPulse{0%,100%{box-shadow:0 0 30px #facc15aa}50%{box-shadow:0 0 50px #facc15, 0 0 70px #eab308}}
@keyframes shine{0%{transform:translateX(-100%) rotate(25deg)}100%{transform:translateX(200%) rotate(25deg)}}
.num{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:13px;background:#0a0a18;border:1px solid #222;z-index:1}
.num.gold{background:linear-gradient(135deg,#fff176,#facc15,#ff8f00);color:#000;box-shadow:0 0 15px #facc15;font-size:16px}
.num.silver{background:linear-gradient(135deg,#fff,#94a3b8);color:#000}
.num.bronze{background:linear-gradient(135deg,#fdba74,#f97316);color:#000}
.name{font-weight:800;flex:1;z-index:1;font-size:15px}
.like{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.15);padding:7px 12px;border-radius:20px;cursor:pointer;transition:.2s;z-index:1}
.like:active{transform:scale(1.3)}.like.liked{background:linear-gradient(135deg,#8b5cf6,#ec4899);box-shadow:0 0 15px #8b5cf6;pointer-events:none}
.like b{font-size:13px}
.crown{position:absolute;top:-8px;left:52px;font-size:18px;animation:float 2s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style></head><body><div class="bg"></div><div class="stars"></div><div class="wrap"><h1>BLOCKMAN GO<br><span>BED WARS</span></h1><div class="line"></div><div class="tabs"><div class="tab active" onclick="showTab('mobile',this)">🔥 TOP MOBILE</div><div class="tab" onclick="showTab('emu',this)">😈 TOP EMU</div></div><div id="mobile" class="list active"></div><div id="emu" class="list"></div></div>
<script>
const DB="https://bwtiers-e00f0-default-rtdb.firebaseio.com";
const mobilePlayers=["Amaury","NotEgo","CnBeast","Flaax","Flinney","Elzair","Kurio","Beta","Zactyo","Naxo","Ownzy","Kairo","Killer","Rishi","Adish","Yuta","Kisaki","Samurai","zeus","Quar"];
const emuPlayers=["Beny","Bannks","Fredd","Azuky","SanoManjiro","Mihan","Astro","Aris","Anfal","Beta"];
let allLikes={};
async function loadLikes(){try{const r=await fetch(DB+"/likes.json");allLikes=await r.json()||{};}catch(e){allLikes={};}render();}
function render(){renderList('mobile',mobilePlayers);renderList('emu',emuPlayers);}
function renderList(id,players){const c=document.getElementById(id);c.innerHTML="";const my=JSON.parse(localStorage.getItem('myLikes')||'[]');players.forEach((name,i)=>{const rank=i+1;let ex="";let nc="";if(rank==1){ex="t1";nc="gold"}else if(rank==2){ex="t2";nc="silver"}else if(rank==3){ex="t3";nc="bronze"}else if(rank<=10){ex="t4-10"}const key=id+"_"+name.replace(/\s/g,'_');const count=allLikes[key]||0;const liked=my.includes(key)?"liked":"";const crown=rank==1?'<div class="crown">👑</div>':'';c.innerHTML+=`<div class="card ${ex}">${crown}<div class="num ${nc}">T${rank}</div><div class="name">${name}</div><div class="like ${liked}" onclick="like('${key}')"><span>❤️</span><b>${count}</b></div></div>`;});}
async function like(key){const my=JSON.parse(localStorage.getItem('myLikes')||'[]');if(my.includes(key))return;my.push(key);localStorage.setItem('myLikes',JSON.stringify(my));let cur=(allLikes[key]||0)+1;allLikes[key]=cur;render();try{await fetch(DB+`/likes/${key}.json`,{method:'PUT',body:JSON.stringify(cur)});}catch(e){}}
window.showTab=(id,el)=>{document.querySelectorAll('.list').forEach(l=>l.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');el.classList.add('active');}
loadLikes();setInterval(loadLikes,4000);
</script></body></html>
