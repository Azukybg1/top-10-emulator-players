<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BW Galaxy Tiers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}body{background:#050510;color:#fff;font-family:'Outfit',sans-serif}
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 20% 20%, #2a1a6a 0%, #120a2e 25%, #050510 60%, #000 100%)}
.wrap{max-width:640px;margin:auto;padding:18px;filter:blur(8px);transition:.3s}.wrap.unlocked{filter:none}
h1{text-align:center;font-size:32px;font-weight:900;margin-top:15px}h1 span{background:linear-gradient(90deg,#a78bfa,#60a5fa,#f0abfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.line{height:1px;background:linear-gradient(90deg,transparent,#8a2be2,#60a5fa,transparent);margin:15px 0}
.tabs{display:flex;gap:8px}.tab{flex:1;padding:11px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);text-align:center;font-weight:900;cursor:pointer;font-size:12px}
.tab.active{background:linear-gradient(135deg,#7c3aed,#4f46e5);box-shadow:0 0 15px #7c3aed88}
.list{display:none;margin-top:16px}.list.active{display:block}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:10px;margin-bottom:9px}
.card.t1{border:2px solid #facc15;box-shadow:0 0 18px #facc15aa}.num{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:12px;background:#0a0a18;border:1px solid #222}.num.gold{background:linear-gradient(135deg,#fff176,#facc15,#ff8f00);color:#000}.name{font-weight:800;flex:1}
.like{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);padding:6px 10px;border-radius:20px;cursor:pointer}.like.liked{background:linear-gradient(135deg,#8b5cf6,#ec4899);pointer-events:none}
#popup{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.88);backdrop-filter:blur(12px);display:grid;place-items:center;padding:15px;overflow-y:auto}
.popup-box{background:#15152f;border:2px solid #7c3aed;border-radius:20px;padding:20px;width:100%;max-width:400px;box-shadow:0 0 40px #7c3aed88}
.popup-box h2{text-align:center;font-size:20px;margin-bottom:4px}.popup-box p{text-align:center;opacity:.6;font-size:12px;margin-bottom:12px}
.popup-box input,.popup-box select{width:100%;padding:12px;border-radius:10px;background:#0a0a18;border:1px solid #333;color:#fff;margin-bottom:8px;font-family:'Outfit';font-size:13px;outline:none}
.popup-box button{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-weight:900;cursor:pointer}
.file-label{display:block;width:100%;padding:12px;border-radius:10px;background:rgba(124,58,237,0.2);border:1px dashed #7c3aed;text-align:center;cursor:pointer;margin-bottom:8px;font-size:13px}
.reg-card{background:rgba(255,255,255,0.06);border:1px solid rgba(124,58,237,0.4);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.reg-card img{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid #7c3aed}
.clip-btn{font-size:11px;background:#ff0050;padding:4px 8px;border-radius:6px;color:#fff;text-decoration:none;margin-top:4px;display:inline-block}
</style></head><body><div class="bg"></div>
<div id="popup"><div class="popup-box"><h2>🎮 REGISTRO</h2><p>* Obligatorio para entrar</p>
<input id="pName" placeholder="Nombre en el juego *">
<input id="pID" type="number" placeholder="ID del juego * Ej: 12345678">
<select id="pPlat"><option value="">Plataforma *</option><option value="Mobile">📱 Mobile</option><option value="Emu">💻 Emu</option></select>
<input id="pTeam" placeholder="Team / Clan *">
<label class="file-label" for="pPhoto">📸 Subir Foto / Logo (opcional)<input type="file" id="pPhoto" accept="image/*" style="display:none" onchange="previewPhoto(this)"><div id="photoName" style="font-size:11px;opacity:.6;margin-top:4px"></div></label>
<input id="pClip" placeholder="Link de tu clip TikTok/YouTube (opcional)">
<button onclick="doRegister()">ENTRAR AL TOP 🔥</button>
</div></div>
<div class="wrap" id="mainWrap"><h1>BLOCKMAN GO<br><span>BED WARS</span></h1><div class="line"></div>
<div class="tabs"><div class="tab active" onclick="showTab('mobile',this)">🔥 MOBILE</div><div class="tab" onclick="showTab('emu',this)">😈 EMU</div><div class="tab" onclick="showTab('regs',this)">📋 REGISTROS</div></div>
<div id="mobile" class="list active"></div><div id="emu" class="list"></div><div id="regs" class="list"><div id="regsList"></div></div></div>
<script>
const DB="https://bwtiers-e00f0-default-rtdb.firebaseio.com";
const mobilePlayers=["Amaury","NotEgo","CnBeast","Flaax","Flinney","Elzair","Kurio","Beta","Zactyo","Naxo","Ownzy","Kairo","Killer","Rishi","Adish","Yuta","Kisaki","Samurai","zeus","Quar"];
const emuPlayers=["Beny","Bannks","Fredd","Azuky","SanoManjiro","Mihan","Astro","Aris","Anfal","Beta"];
let allLikes={}, allRegs={}, photoBase64="";
function previewPhoto(input){if(input.files && input.files[0]){const f=input.files[0];if(f.size>800000){alert('Foto muy pesada, max 800KB');return;}document.getElementById('photoName').textContent=f.name;const r=new FileReader();r.onload=e=>photoBase64=e.target.result; r.readAsDataURL(f);}}
function checkLock(){if(localStorage.getItem('bw_registered')){document.getElementById('popup').style.display='none';document.getElementById('mainWrap').classList.add('unlocked');}}
async function doRegister(){
const name=document.getElementById('pName').value.trim();
const idGame=document.getElementById('pID').value.trim();
const plat=document.getElementById('pPlat').value;
const team=document.getElementById('pTeam').value.trim();
const clip=document.getElementById('pClip').value.trim();
if(!name||!idGame||!plat||!team){alert('❌ LLENA TODO LO OBLIGATORIO *');return;}
const btn=document.querySelector('.popup-box button');btn.textContent='REGISTRANDO...';btn.disabled=true;
const id=Date.now();const data={name,idGame,plat,team,clip,photo:photoBase64,date:new Date().toLocaleDateString()};
try{await fetch(DB+`/registered/${id}.json`,{method:'PUT',body:JSON.stringify(data)});localStorage.setItem('bw_registered',JSON.stringify(data));allRegs[id]=data;document.getElementById('popup').style.display='none';document.getElementById('mainWrap').classList.add('unlocked');}catch(e){alert('Error');btn.textContent='ENTRAR AL TOP 🔥';btn.disabled=false;}}
async function load(){try{const r1=await fetch(DB+"/likes.json");allLikes=await r1.json()||{};}catch(e){}try{const r2=await fetch(DB+"/registered.json");allRegs=await r2.json()||{};}catch(e){}render();renderRegs();}
function render(){renderList('mobile',mobilePlayers);renderList('emu',emuPlayers);}
function renderList(id,players){const c=document.getElementById(id);c.innerHTML="";const my=JSON.parse(localStorage.getItem('myLikes')||'[]');players.forEach((name,i)=>{const rank=i+1;let ex=rank==1?'t1':'';let nc=rank==1?'gold':rank==2?'silver':rank==3?'bronze':'';const key=id+"_"+name.replace(/\s/g,'_');const count=allLikes[key]||0;const liked=my.includes(key)?"liked":"";c.innerHTML+=`<div class="card ${ex}"><div class="num ${nc}">T${rank}</div><div class="name">${name} ${rank==1?'👑':''}</div><div class="like ${liked}" onclick="like('${key}')"><span>❤️</span><b>${count}</b></div></div>`;});}
function renderRegs(){const c=document.getElementById('regsList');c.innerHTML="";const vals=Object.values(allRegs).reverse();if(vals.length==0){c.innerHTML='<p style="opacity:.5;text-align:center">Sin registros</p>';return;}c.innerHTML=`<p style="margin-bottom:10px;opacity:.7">Total: ${vals.length} jugadores</p>`;vals.forEach(r=>{const img=r.photo?`<img src="${r.photo}">`:`<div style="width:50px;height:50px;border-radius:50%;background:#7c3aed;display:grid;place-items:center;font-weight:900">${r.name[0]}</div>`;const clipBtn=r.clip?`<a href="${r.clip}" target="_blank" class="clip-btn">🎬 Ver Clip</a>`:'';c.innerHTML+=`<div class="reg-card">${img}<div style="flex:1"><b>${r.name}</b> <small style="opacity:.6">(${r.plat})</small><br><small style="opacity:.6">ID: ${r.idGame} | ${r.team}</small><br>${clipBtn}</div><div>✅</div></div>`;});}
async function like(key){const my=JSON.parse(localStorage.getItem('myLikes')||'[]');if(my.includes(key))return;let cur=(allLikes[key]||0)+1;allLikes[key]=cur;my.push(key);localStorage.setItem('myLikes',JSON.stringify(my));render();await fetch(DB+`/likes/${key}.json`,{method:'PUT',body:JSON.stringify(cur)});}
window.showTab=(id,el)=>{document.querySelectorAll('.list').forEach(l=>l.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');el.classList.add('active');}
checkLock();load();setInterval(load,5000);
</script></body></html>
