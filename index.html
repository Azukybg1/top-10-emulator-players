<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 10 Emulator Players</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
  background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
  overflow-x: hidden;
}
.stars {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: transparent url(https://i.imgur.com/YKY28eT.png) repeat;
  animation: moveStars 200s linear infinite;
  opacity: 0.5;
  z-index: -1;
}
@keyframes moveStars { from {background-position: 0 0} to {background-position: -10000px 5000px} }
.galaxy-card {
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
}
</style>
</head>
<body class="text-white min-h-screen p-6">
<div class="stars"></div>

  <h1 class="text-3xl font-black text-center mb-2 drop-shadow-[0_0_15px_#8a2be2]">✦ Top 10 Emulator Players</h1>
  <p class="text-center text-purple-300 mb-8">Bedwars Galaxy Ranking</p>
  
  <div class="max-w-2xl mx-auto">
    <div id="list" class="grid gap-4"></div>
  </div>

<script>
const players = [
  { name: "Beny", tier: "T1" }, { name: "Bannks", tier: "T2" },
  { name: "Fredd", tier: "T3" }, { name: "Azuky", tier: "T4" },
  { name: "SanoManjiro", tier: "T5" }, { name: "Mihan", tier: "T6" },
  { name: "Astro", tier: "T7" }, { name: "Aris", tier: "T8" },
  { name: "Anfal", tier: "T9" }, { name: "Beta", tier: "T10" },
];

const list = document.getElementById('list');
players.forEach((p,i) => {
  let rank = i+1;
  let glow = rank==1 ? "shadow-[0_0_20px_#facc15] border-yellow-400" : "shadow-[0_0_10px_rgba(138,43,226,0.5)]";
  list.innerHTML += `
    <div class="galaxy-card flex justify-between items-center p-4 rounded-2xl ${glow}">
      <div class="flex items-center gap-3">
        <span class="w-9 h-9 flex items-center justify-center rounded-full font-black bg-gradient-to-br from-purple-600 to-blue-500">${rank}</span>
        <span class="font-bold text-lg tracking-wide">${p.name}</span>
      </div>
      <span class="px-3 py-1 rounded-full text-sm font-black bg-black/50 border border-purple-500/30">${p.tier}</span>
    </div>
  `;
});
</script>
</body>
</html>
