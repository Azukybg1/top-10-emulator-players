<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOCKMAN GO - BED WARS RANKINGS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070707;color:#fff;font-family:Inter,Arial,sans-serif;overflow-x:hidden}
canvas{position:fixed;inset:0;z-index:-1;pointer-events:none}
#hearts{z-index:1} #pixels{opacity:.7}
.container{max-width:620px;margin:0 auto;padding:20px;position:relative;z-index:2}
h1{text-align:center;font-size:32px;font-weight:900;animation:glow 3s infinite alternate}
@keyframes glow{from{text-shadow:0 0 10px #fff3}to{text-shadow:0 0 20px #fff}}
.sub{text-align:center;opacity:.5;font-size:11px;letter-spacing:4px;margin:8px 0 18px}
.tools{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.tools button{background:#111;border:1px solid #2a2a2a;color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:11px;cursor:pointer}
.tools button.active{background:#fff;color:#000;box-shadow:0 0 15px #fff}
.tabs{display:flex;gap:10px;margin-bottom:22px}
.tab{flex:1;padding:13px;text-align:center;border-radius:999px;font-weight:800;cursor:pointer;background:#141414;border:1px solid #222}
.tab.active{background:#fff;color:#000;box-shadow:0 0 20px #fff6}
.list{display:none}.list.active{display:block}
.card{background:#111;border:1px solid #1f1f1f;border-radius:14px;margin-bottom:9px;overflow:hidden;cursor:pointer;transition:.3s}
.card:hover{border-color:#fff3;transform:translateX(3px)}
.card.top{border-color:#ffffff22;box-shadow:0 0 12px #ffffff10}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.rank{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;background:#1c1c1c;border:1px solid #2a2a2a;font-weight:800;font-size:12px}
.card.top.rank{background:#fff;color:#000;box-shadow:0 0 12px #fff}
.name{font-weight:700;font-size:14px}
.tag{margin-left:auto;font-size:9px;font-weight:900;background:#fff;color:#000;padding:5px 10px;border-radius:20px}
.tag.goat{background:linear-gradient(90deg,#fff,#aaa);box-shadow:0 0 10px #fff}
.history{max-height:0;overflow:hidden;transition:.4s;background:#0a0a0a;border-top:1px solid #1a1a1a}
.card.open.history{max-height:500px;padding:12px 14px}
.hist-title{font-size:10px;opacity:.5;letter-spacing:2px;margin-bottom:8px}
.hist-item{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #151515}
</style>
</head>
<body>
<canvas id="pixels"></canvas><canvas id="hearts"></canvas>
<div class="container">
<h1>BLOCKMAN GO<br>BED WARS</h1>
<div class="sub">OFFICIAL RANKINGS</div>
<div class="tools">
<button id="heartToggle" onclick="toggleHearts()">🤍 HEARTS: OFF</button>
<button onclick="saveNewMonth()">📅 SAVE NEW MONTH</button>
</div>
<div class="tabs">
<div class="tab active" onclick="showTab('mobile',this)">TOP MOBILE</div>
<div class="tab" onclick="showTab('emu',this)">TOP EMULATOR</div>
</div>
<div id="mobile" class="list active"></div>
<div id="emu" class="list"></div>
</div>
<script>
let defaultMobile=["Amaury","NotEgo","Cnbeast","Huzu","Flaax","Flinney","Elzair","EgeOwns","Kurio","Beta","Zactyo","Naxo","Ownzy","Harsh","Kairo","Killer","Rishi","Adish","Yuta","Quar"];
// NUEVO ORDEN QUE ME PASASTE
let defaultEmu=["Beny","Azuky","Bannks","Fredd","SanoManjiro","Mihan","Astro","Aris","Anfal","Beta"];

function getMonth(){return new Date().toLocaleString('en-US',{month:'short',year:'numeric'})}
function load(){let d=localStorage.getItem('bg_rankings_v3');if(d){return JSON.parse(d)}else{let init={};defaultMobile.forEach((n,i)=>init['M_'+n]={name:n,history:[["Jul 2025","T"+(i+1)]],goat:i<3});defaultEmu.forEach((n,i)=>init['E_'+n]={name:n,history:[["Jul 2025","T"+(i+1)]],goat:false});return {players:init,lastMonth:"Jul 2025",currentMobile:defaultMobile,currentEmu:defaultEmu}}}
let data=load();function save(){localStorage.setItem('bg_rankings_v3',JSON.stringify(data))}

function render(){
 let m="",e="";
 data.currentMobile.forEach((name,idx)=>{
   let p=data.players['M_'+name]||{name,history:[],goat:idx<3};
   let r=idx+1;let topClass=r<=3?" top":"";let badge=p.goat?'<div class="tag goat">GOAT</div>':(r<=3?'<div class="tag">TOP '+r+'</div>':'');
   let suffix=p.goat?" ⚚ GOAT ⚚":"";
   let hist=p.history.map(h=>'<div class="hist-item"><span>'+h[0]+'</span><span>'+h[1]+'</span></div>').join('')||'<div style="opacity:.4;font-size:11px">New player</div>';
   m+='<div class="card'+topClass+'" onclick="this.classList.toggle(\'open\')"><div class="row"><div class="rank">'+r+'</div><div class="name">T'+r+' • '+name+suffix+'</div>'+badge+'</div><div class="history"><div class="hist-title">MONTHLY HISTORY</div>'+hist+'</div></div>';
 });
 data.currentEmu.forEach((name,idx)=>{
   let p=data.players['E_'+name]||{name,history:[],goat:false};
   let r=idx+1;let topClass=r<=3?" top":"";let badge=r<=3?'<div class="tag">TOP '+r+'</div>':'';
   let hist=p.history.map(h=>'<div class="hist-item"><span>'+h[0]+'</span><span>'+h[1]+'</span></div>').join('')||'<div style="opacity:.4;font-size:11px">New player</div>';
   e+='<div class="card'+topClass+'" onclick="this.classList.toggle(\'open\')"><div class="row"><div class="rank">'+r+'</div><div class="name">T'+r+' ┃ '+name+'</div>'+badge+'</div><div class="history"><div class="hist-title">MONTHLY HISTORY</div>'+hist+'</div></div>';
 });
 document.getElementById('mobile').innerHTML=m;
 document.getElementById('emu').innerHTML=e;
}
render();

function saveNewMonth(){
 let last=data.lastMonth; let now=getMonth();
 data.currentMobile.forEach((name,idx)=>{let k='M_'+name;if(!data.players[k])data.players[k]={name,history:[],goat:false};data.players[k].history.unshift([last,'T'+(idx+1)])});
 data.currentEmu.forEach((name,idx)=>{let k='E_'+name;if(!data.players[k])data.players[k]={name,history:[],goat:false};data.players[k].history.unshift([last,'T'+(idx+1)])});
 data.lastMonth=now; save(); render(); alert('History saved: '+last+' -> '+now);
}
function showTab(id,el){document.querySelectorAll('.list').forEach(l=>l.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');el.classList.add('active');}
// white particles
const c=document.getElementById('pixels'),x=c.getContext('2d');let w,h,dots=[];function rs(){w=c.width=innerWidth;h=c.height=innerHeight}window.addEventListener('resize',rs);rs();for(let i=0;i<70;i++)dots.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+0.6,s:Math.random()*0.8+0.2,o:Math.random()*0.5+0.2});(function a(){x.clearRect(0,0,w,h);dots.forEach(p=>{p.y-=p.s;p.x+=Math.sin(p.y/80)*0.4;if(p.y<0){p.y=h;p.x=Math.random()*w}x.globalAlpha=p.o;x.fillStyle='#fff';x.shadowBlur=8;x.shadowColor='#fff';x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill();});requestAnimationFrame(a);})();
// hearts
const hc=document.getElementById('hearts'),hx=hc.getContext('2d');let hearts=[],on=false;function rsH(){hc.width=innerWidth;hc.height=innerHeight}window.addEventListener('resize',rsH);rsH();function toggleHearts(){on=!on;document.getElementById('heartToggle').innerText=on?'🤍 HEARTS: ON':'🤍 HEARTS: OFF';document.getElementById('heartToggle').classList.toggle('active',on);if(on&&hearts.length==0)for(let i=0;i<25;i++)hearts.push({x:Math.random()*hc.width,y:Math.random()*hc.height+hc.height,s:Math.random()*1.2+0.4,o:Math.random()*0.8+0.2,size:Math.random()*14+10,sway:Math.random()*2});}(function ah(){hx.clearRect(0,0,hc.width,hc.height);if(on)hearts.forEach(p=>{p.y-=p.s;p.x+=Math.sin(p.y/100)*p.sway;if(p.y<-20){p.y=hc.height+20;p.x=Math.random()*hc.width}hx.globalAlpha=p.o;hx.font=p.size+'px Arial';hx.fillText('🤍',p.x,p.y);});requestAnimationFrame(ah);})();
</script>
</body>
</html>
