<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOCKMAN GO - BED WARS RANKINGS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=Creepster&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0610;color:#fff;font-family:'Inter',sans-serif;overflow-x:hidden}
canvas{position:fixed;inset:0;z-index:0}
.bg-glow{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(600px at 50% -10%, #ff6a0050, transparent 70%), radial-gradient(800px at 90% 80%, #9b5cff30, transparent 60%), radial-gradient(500px at 10% 90%, #ff6a0020, transparent 60%)}
.container{max-width:580px;margin:0 auto;padding:24px;position:relative;z-index:2}
h1{text-align:center;font-size:38px;font-weight:900;letter-spacing:1.5px;margin-top:30px;line-height:0.9;font-family:'Creepster', cursive}
h1 span{background:linear-gradient(180deg,#fff 10%,#ff8a2a 50%,#ff5e00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px #ff6a00aa) drop-shadow(0 0 40px #9b5cff66)}
.sub{text-align:center;color:#ff8a2a;font-size:10px;letter-spacing:5px;font-weight:700;margin:10px 0 32px;opacity:.9}
.sub::before{content:'🎃 '}.sub::after{content:' 🎃'}
.tabs{display:flex;gap:10px;margin-bottom:24px;padding:6px;background:#1a1128;border:1px solid #2e1f4a;border-radius:999px;box-shadow:0 0 20px #9b5cff22 inset}
.tab{flex:1;padding:12px;text-align:center;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer;transition:.35s cubic-bezier(.2,.8,.2,1);color:#7a6a9a}
.tab.active{background:linear-gradient(180deg,#ff8a2a,#ff4d00);color:#fff;box-shadow:0 6px 20px #ff6a0066, inset 0 1px 0 #ffffff55}
.list{display:none}
.list.active{display:block;animation:rise.5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.row{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#1c142e,#140e1f);border:1px solid #2e2347;border-radius:16px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden;transition:.3s}
.row::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(100deg,transparent, #ff8a2a15, transparent);transform:skewX(-15deg);transition:.6s}
.row:hover::after{left:130%}
.row:hover{transform:translateY(-2px);border-color:#ff6a0055;background:linear-gradient(180deg,#241a3a,#1a1228)}
.row.top{background:linear-gradient(180deg,#2a1a12,#1f140e);border-color:#ff6a0044}
.row.top.rank{background:linear-gradient(180deg,#ff8a2a,#ff4d00);color:#fff;border:none;box-shadow:0 0 0 1px #ff6a0055, 0 0 20px #ff6a00aa, 0 4px 15px #ff6a0044}
.rank{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#201630;border:1px solid #3a2a5a;font-weight:900;font-size:13px;flex-shrink:0}
.name{font-weight:700;font-size:14.5px;letter-spacing:.2px}
.tag{margin-left:auto;font-size:8.5px;font-weight:900;letter-spacing:1.2px;padding:6px 11px;border-radius:999px;background:#ff6a00;color:#fff;box-shadow:0 0 15px #ff6a0066}
.row:not(.top).tag{background:#221836;color:#8a7aa8;box-shadow:none;border:1px solid #3a2a5a}
.row.top.tag{background:#fff;color:#ff4d00}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="bg-glow"></div>
<div class="container">
<h1><span>BLOCKMAN GO<br>BED WARS</span></h1>
<div class="sub">HALLOWEEN EDITION • OFFICIAL RANKINGS</div>
<div class="tabs">
<div class="tab active" onclick="showTab('mobile',this)">🎃 TOP MOBILE</div>
<div class="tab" onclick="showTab('emu',this)">👻 TOP EMULATOR</div>
</div>
<div id="mobile" class="list active"></div>
<div id="emu" class="list"></div>
</div>
<script>
const mobile = ["Amaury","CnBeast","Player","Elzair","Beta","Naxo","Rishi","Benykz","ItzRainbowBG","Aiden","Habib","IamNotPc","Sehur","ThunderBG","SamuraiBG","","","","",""];
const emu = ["Benykz","AzukyBG","Bannks","SanoManjiro","Fredd","Phoenix","Mihan","Astro","Anfal","Beta"];
function render(list,id){
 let html="";
 for(let i=0;i<list.length;i++){
   if(!list[i]) continue;
   let r=i+1;
   let icon = r==1?'👑':r==2?'🎃':r==3?'🦇':'';
   let topClass = r<=3? " top" : "";
   let badge = `<div class="tag">${icon} TOP ${r}</div>`;
   html += `<div class="row${topClass}"><div class="rank">${r}</div><div class="name">T${r} • ${list[i]}</div>${badge}</div>`;
 }
 document.getElementById(id).innerHTML=html;
}
render(mobile,'mobile'); render(emu,'emu');
function showTab(id,el){
 document.querySelectorAll('.list').forEach(l=>l.classList.remove('active'));
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 el.classList.add('active');
}
const c=document.getElementById('particles'),x=c.getContext('2d');
let w,h,dots=[];
function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
window.addEventListener('resize',resize);resize();
const colors=['#ff6a00','#ff8a2a','#9b5cff','#ffde59'];
const emojis=['🎃','🦇','👻'];
for(let i=0;i<70;i++) dots.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+0.4,s:Math.random()*0.6+0.2,o:Math.random()*0.5+0.3,c:colors[Math.floor(Math.random()*colors.length)],e:Math.random()<0.15?emojis[Math.floor(Math.random()*emojis.length)]:null});
(function anim(){
 x.clearRect(0,0,w,h);
 dots.forEach(p=>{
   p.y-=p.s;
   if(p.y<0){p.y=h;p.x=Math.random()*w}
   x.globalAlpha=p.o;
   if(p.e){
     x.font=`${p.r*10}px serif`;
     x.fillText(p.e,p.x,p.y);
   }else{
     x.fillStyle=p.c;
     x.shadowBlur=12;x.shadowColor=p.c;
     x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();
     x.shadowBlur=0;
   }
 });
 requestAnimationFrame(anim);
})();
</script>
</body>
</html>
